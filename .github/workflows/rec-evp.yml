name: rec-evp

on:
  push:
    branches: [testing-vhs]
    paths:
      - '.github/workflows/rec-evp.yml'
      - 'scenarios/**'
      - 'scripts/**'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: rec-evp-collect
  cancel-in-progress: false

jobs:
  record:
    name: ${{ matrix.cell_os }}-${{ matrix.shell }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # EVP publishes only Linux/macOS static binaries and drives an embedded libghostty
        # PTY; per scripts/tools.json its cells are linux-bash, linux-pwsh, linux-zsh,
        # macos-zsh (no Windows build exists). The Linux musl build runs on ubuntu-22.04.
        include:
          - { os: ubuntu-22.04, cell_os: linux, shell: bash }
          - { os: ubuntu-22.04, cell_os: linux, shell: pwsh }
          - { os: ubuntu-22.04, cell_os: linux, shell: zsh }
          - { os: macos-latest, cell_os: macos, shell: zsh }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install omp
        run: bash scenarios/shared/install-omp.sh

      - name: Install EVP (pinned latest)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash scenarios/evp/install-evp.sh

      - name: Install zsh (linux zsh cell)
        if: matrix.cell_os == 'linux' && matrix.shell == 'zsh'
        run: sudo apt-get update && sudo apt-get install -y zsh

      - name: Render scenarios
        shell: bash
        timeout-minutes: 20
        run: |
          # setup-python exports LD_LIBRARY_PATH to its own lib dir; clear it so nothing
          # perturbs the native binaries this step invokes (EVP is a static prebuilt binary).
          unset LD_LIBRARY_PATH
          set -u
          mkdir -p tapes out
          echo "evp=$(command -v evp) -> $(evp --version)"
          echo "omp=$(command -v omp) -> $(omp --version 2>/dev/null | head -1)"

          # The scenario tapes are shell-agnostic; EVP uses the VHS .tape language whose
          # shell is a `Set Shell` startup command, so compose it at the head of each
          # cell's tape. Startup commands (Set/Env) must precede runtime commands, and the
          # scenario tapes only add more Set/Env startup lines, so prepending is valid.
          case "${{ matrix.shell }}" in
            bash) shell_cmd="bash --norc" ;;
            zsh)  shell_cmd="zsh -f" ;;
            pwsh) shell_cmd="pwsh -NoLogo" ;;
            *)    shell_cmd="${{ matrix.shell }}" ;;
          esac

          # GNU `timeout` is absent on macOS runners (it lives in coreutils as `gtimeout`),
          # so pick whichever exists; fall back to no wrapper. Our tapes are time-bounded
          # (fixed Sleeps + the tui-splash watchdog), and the step has its own timeout-minutes.
          if command -v timeout >/dev/null 2>&1; then TIMEOUT="timeout 150"
          elif command -v gtimeout >/dev/null 2>&1; then TIMEOUT="gtimeout 150"
          else TIMEOUT=""; fi
          echo "timeout wrapper: ${TIMEOUT:-<none>}"

          for f in scenarios/evp/0*.tape; do
            s="$(basename "$f" .tape)"          # e.g. 01-launch-exit
            scenario="${s#*-}"                  # e.g. launch-exit
            base="${{ matrix.cell_os }}-${{ matrix.shell }}-${scenario}"
            gif="out/${base}.gif"
            svg="out/${base}.svg"
            tape="tapes/${s}.tape"
            { echo "Set Shell \"${shell_cmd}\""; cat "$f"; } > "$tape"
            echo "== rendering ${scenario} =="
            if [ "$scenario" = "tui-splash" ]; then
              # The omp TUI ignores headless quit keystrokes, so escalate signals to the
              # omp process after the splash has been captured; once it dies the shell
              # returns and the tape's `exit` lets EVP finalize the recording.
              (
                sleep 6
                pkill -INT  -f 'omp --no-session' 2>/dev/null || true
                sleep 2
                pkill -TERM -f 'omp --no-session' 2>/dev/null || true
                sleep 2
                pkill -KILL -f 'omp --no-session' 2>/dev/null || true
              ) &
              watchdog=$!
              $TIMEOUT evp "$tape" --output "$gif" --output "$svg" --log-level info \
                || echo "  evp exit=$? for ${scenario}"
              kill "$watchdog" 2>/dev/null || true
            else
              $TIMEOUT evp "$tape" --output "$gif" --output "$svg" --log-level info \
                || echo "  evp exit=$? for ${scenario}"
            fi
            echo "  gif: $(ls -la "$gif" 2>/dev/null || echo MISSING)"
            echo "  svg: $(ls -la "$svg" 2>/dev/null || echo MISSING)"
          done
          echo "=== out ==="; ls -la out || true

      - name: Evaluate and emit results
        if: always()
        shell: bash
        run: |
          set -u
          # Start from a clean slate so this cell's artifact carries ONLY its own fresh
          # files; the checkout brings stale committed results that must not ride along.
          rm -rf results/evp assets/evp
          mkdir -p results/evp assets/evp
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          OMPV="$(omp --version 2>/dev/null | head -1 || echo unknown)"
          EVPV="${EVP_TAG:-latest}"
          for scenario in launch-exit help-tour tui-splash typing-demo; do
            base="${{ matrix.cell_os }}-${{ matrix.shell }}-${scenario}"
            gif="out/${base}.gif"
            svg="out/${base}.svg"
            svgpath=""
            if [ -f "$gif" ] && python scripts/validate_gif.py "$gif" >/dev/null 2>&1; then
              cp -f "$gif" "assets/evp/${base}.gif"
              verdict=working; gifpath="assets/evp/${base}.gif"
              if [ -f "$svg" ]; then cp -f "$svg" "assets/evp/${base}.svg"; svgpath="assets/evp/${base}.svg"; fi
              case "$scenario" in
                tui-splash)  reason="omp TUI ignores headless quit keystrokes; a background SIGINT->SIGTERM->SIGKILL watchdog ends the omp process so EVP can finalize the splash recording (scenarios.md S3)";;
                typing-demo) reason="shell-prompt typing fallback: the omp TUI input box cannot be driven headlessly, so the sample prompt is animated at a shell prompt (scenarios.md S4)";;
                *) reason="";;
              esac
            else
              verdict=broken; gifpath=""
              case "$scenario" in
                tui-splash)  reason="EVP launched the omp TUI but no valid GIF was captured before the watchdog ended the session";;
                typing-demo) reason="shell-prompt typing fallback produced no valid GIF in CI (scenarios.md S4)";;
                *) reason="no valid GIF produced in CI";;
              esac
            fi
            jq -n \
              --arg os "${{ matrix.cell_os }}" \
              --arg shell "${{ matrix.shell }}" \
              --arg scenario "$scenario" \
              --arg verdict "$verdict" \
              --arg reason "$reason" \
              --arg gif "$gifpath" \
              --arg svg "$svgpath" \
              --arg run "$RUN_URL" \
              --arg ompv "$OMPV" \
              --arg evpv "$EVPV" \
              '{tool:"evp",os:$os,shell:$shell,scenario:$scenario,verdict:$verdict,reason:$reason,gif:(if $gif=="" then null else $gif end),run_url:$run,extra:{svg:(if $svg=="" then null else $svg end),tool_version:$evpv,omp_version:$ompv}}' \
              > "results/evp/${base}.json"
          done
          echo "=== results ==="; cat results/evp/*.json

      - name: Upload cell artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evp-${{ matrix.cell_os }}-${{ matrix.shell }}
          path: |
            assets/evp/
            results/evp/
          if-no-files-found: warn

  collect:
    name: collect
    needs: [record]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: testing-vhs
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: _artifacts

      - name: Assemble assets and results
        run: |
          mkdir -p assets/evp results/evp
          find _artifacts -type f \( -name '*.gif' -o -name '*.svg' \) -path '*assets*' -exec cp -f {} assets/evp/ \; || true
          find _artifacts -type f -name '*.json' -path '*results*' -exec cp -f {} results/evp/ \; || true
          echo "=== assets/evp ==="; ls -la assets/evp || true
          echo "=== results/evp ==="; ls -la results/evp || true

      - name: Commit recordings and results
        run: |
          bash scripts/commit-artifacts.sh "chore(evp): recordings + results"

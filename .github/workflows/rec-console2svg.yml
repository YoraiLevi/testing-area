name: rec-console2svg

on:
  push:
    branches: [testing-vhs]
    paths:
      - '.github/workflows/rec-console2svg.yml'
      - 'scenarios/**'
      - 'scripts/**'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: rec-console2svg-collect
  cancel-in-progress: false

jobs:
  record:
    name: ${{ matrix.cell_os }}-${{ matrix.shell }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04,   cell_os: linux,   shell: bash }
          - { os: ubuntu-22.04,   cell_os: linux,   shell: pwsh }
          - { os: ubuntu-22.04,   cell_os: linux,   shell: zsh }
          - { os: macos-latest,   cell_os: macos,   shell: zsh }
          - { os: windows-latest, cell_os: windows, shell: pwsh }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install omp (unix)
        if: runner.os != 'Windows'
        run: bash scenarios/shared/install-omp.sh

      - name: Install omp (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scenarios/shared/install-omp.ps1

      - name: Install zsh (linux zsh cell)
        if: matrix.cell_os == 'linux' && matrix.shell == 'zsh'
        run: sudo apt-get update && sudo apt-get install -y zsh

      # The official action pins both action code (@v0.9.3) and the binary (version input),
      # but its install script is broken on Windows (git bash mangles the backslashed
      # github.action_path), so Windows installs the pinned release zip directly below.
      - name: Install console2svg (unix)
        if: runner.os != 'Windows'
        uses: arika0093/console2svg@v0.9.3
        with:
          version: '0.9.3'

      # The Windows release archive bundles console2svg + ffmpeg; extract and add to PATH.
      - name: Install console2svg (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $url = "https://github.com/arika0093/console2svg/releases/download/v0.9.3/console2svg-win-x64.zip"
          $dest = "$env:RUNNER_TEMP\console2svg"
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          Invoke-WebRequest -Uri $url -OutFile "$env:RUNNER_TEMP\console2svg.zip"
          Expand-Archive -Path "$env:RUNNER_TEMP\console2svg.zip" -DestinationPath $dest -Force
          $exe = Get-ChildItem -Path $dest -Recurse -Filter console2svg.exe | Select-Object -First 1
          if (-not $exe) { throw "console2svg.exe not found after extracting $url" }
          $dir = $exe.Directory.FullName
          Add-Content -Path $env:GITHUB_PATH -Value $dir
          $env:PATH = "$dir;$env:PATH"
          Write-Host "console2svg installed at $dir"
          & $exe.FullName --version

      # console2svg needs ffmpeg to normalize SVG -> GIF. The Windows release archive
      # already bundles ffmpeg; Linux/macOS install it from the system package manager.
      - name: Install ffmpeg (linux)
        if: matrix.cell_os == 'linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install ffmpeg (macos)
        if: matrix.cell_os == 'macos'
        run: brew list ffmpeg >/dev/null 2>&1 || brew install ffmpeg

      - name: Render scenarios
        if: always()
        shell: bash
        timeout-minutes: 20
        run: bash scenarios/console2svg/render.sh "${{ matrix.cell_os }}" "${{ matrix.shell }}"

      - name: Evaluate and emit results
        if: always()
        shell: bash
        run: |
          set -u
          # Start clean so this cell's artifact carries ONLY its own fresh files; the
          # checkout brings stale committed results that must not ride along.
          rm -rf results/console2svg assets/console2svg
          mkdir -p results/console2svg assets/console2svg
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          OMPV="$(omp --version 2>/dev/null | head -1 || echo unknown)"
          for scenario in launch-exit help-tour tui-splash typing-demo; do
            base="${{ matrix.cell_os }}-${{ matrix.shell }}-${scenario}"
            case "$scenario" in
              tui-splash)  note="omp TUI captured headlessly via console2svg --timeout (splash/onboarding screen)";;
              typing-demo) note="console2svg has no headless TUI input driver; sample prompt animated as a typed command line via -c (shell-prompt fallback per scenarios.md)";;
              *)           note="";;
            esac
            gif="$(find out -type f -name "${base}.gif" 2>/dev/null | head -1)"
            if [ -n "$gif" ] && python scripts/validate_gif.py "$gif" >/dev/null 2>&1; then
              cp -f "$gif" "assets/console2svg/${base}.gif"
              verdict=working; reason="$note"; gifpath="assets/console2svg/${base}.gif"
            else
              verdict=broken; reason="no valid GIF produced in CI${note:+; $note}"; gifpath=""
            fi
            jq -n \
              --arg os "${{ matrix.cell_os }}" \
              --arg shell "${{ matrix.shell }}" \
              --arg scenario "$scenario" \
              --arg verdict "$verdict" \
              --arg reason "$reason" \
              --arg gif "$gifpath" \
              --arg run "$RUN_URL" \
              --arg ompv "$OMPV" \
              '{tool:"console2svg",os:$os,shell:$shell,scenario:$scenario,verdict:$verdict,reason:$reason,gif:(if $gif=="" then null else $gif end),run_url:$run,extra:{tool_version:"v0.9.3",omp_version:$ompv}}' \
              > "results/console2svg/${base}.json"
          done
          echo "=== results ==="; cat results/console2svg/*.json

      - name: Upload cell artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: console2svg-${{ matrix.cell_os }}-${{ matrix.shell }}
          path: |
            assets/console2svg/
            results/console2svg/
          if-no-files-found: warn

  collect:
    name: collect
    needs: [record]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: testing-vhs
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: _artifacts

      - name: Assemble assets and results
        run: |
          mkdir -p assets/console2svg results/console2svg
          find _artifacts -type f -name '*.gif' -exec cp -f {} assets/console2svg/ \; || true
          find _artifacts -type f -name '*.json' -path '*results*' -exec cp -f {} results/console2svg/ \; || true
          echo "=== assets/console2svg ==="; ls -la assets/console2svg || true
          echo "=== results/console2svg ==="; ls -la results/console2svg || true

      - name: Commit recordings and results
        run: |
          bash scripts/commit-artifacts.sh "chore(console2svg): recordings + results"

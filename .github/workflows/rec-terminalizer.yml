name: rec-terminalizer

on:
  push:
    branches: [testing-vhs]
    paths:
      - '.github/workflows/rec-terminalizer.yml'
      - 'scenarios/**'
      - 'scripts/**'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: rec-terminalizer-collect
  cancel-in-progress: false

jobs:
  record:
    name: ${{ matrix.cell_os }}-${{ matrix.shell }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, cell_os: linux, shell: bash }
          - { os: ubuntu-22.04, cell_os: linux, shell: zsh }
          - { os: ubuntu-22.04, cell_os: linux, shell: pwsh }
          - { os: macos-latest, cell_os: macos, shell: zsh }
          - { os: windows-latest, cell_os: windows, shell: pwsh }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install omp (Unix)
        if: runner.os != 'Windows'
        run: bash scenarios/shared/install-omp.sh

      - name: Install omp (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scenarios/shared/install-omp.ps1

      - name: Install zsh (linux zsh cell)
        if: matrix.cell_os == 'linux' && matrix.shell == 'zsh'
        run: sudo apt-get update && sudo apt-get install -y zsh

      - name: Install Xvfb + Electron/Chromium system libs + fonts
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # terminalizer's `render` runs headless Electron (Chromium); it needs a virtual
          # display (xvfb) plus Chromium's shared libraries, and real monospace fonts so
          # the offscreen render has a font to draw with.
          sudo apt-get install -y \
            xvfb \
            fonts-dejavu-core fonts-liberation \
            libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 \
            libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 \
            libgbm1 libgtk-3-0 libasound2 libxshmfence1 libx11-xcb1 libxss1 \
            libgl1 libgl1-mesa-dri

      - name: Pin Node 20 (macOS)
        if: runner.os == 'macOS'
        # GHA macOS runners now default to Node 24, whose V8 headers require C++20 and
        # break node-pty's native build during `npm install -g terminalizer` ("C++20 or
        # later required."). Node 20 ships a compatible/prebuilt node-pty, so terminalizer
        # installs cleanly. Linux/Windows already install fine, so they keep their Node.
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install terminalizer (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          npm install -g terminalizer
          echo "terminalizer: $(command -v terminalizer)"
          terminalizer --version || true

      - name: Fix Electron chrome-sandbox permissions (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          # Electron's Chromium sandbox helper must be root-owned + SUID or the
          # headless render aborts on GitHub runners (non-root `runner` user).
          CHROME_SANDBOX="$(npm root -g)/terminalizer/node_modules/electron/dist/chrome-sandbox"
          if [ -f "$CHROME_SANDBOX" ]; then
            sudo chown root:root "$CHROME_SANDBOX"
            sudo chmod 4755 "$CHROME_SANDBOX"
            echo "chrome-sandbox fixed: $CHROME_SANDBOX"
          else
            echo "WARNING: chrome-sandbox not found at $CHROME_SANDBOX"
          fi

      - name: Install terminalizer (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          npm install -g terminalizer
          Write-Host "terminalizer: $((Get-Command terminalizer).Source)"
          terminalizer --version

      - name: Record and render scenarios
        if: runner.os == 'Linux'
        shell: bash
        timeout-minutes: 20
        env:
          TERM: xterm-256color
        run: |
          # setup-python exports LD_LIBRARY_PATH to its own lib dir, which breaks the
          # shared libs Electron/Chromium load; clear it for record + render.
          unset LD_LIBRARY_PATH
          set -u
          mkdir -p out rec
          CFG="scenarios/terminalizer/config.yml"
          echo "terminalizer: $(command -v terminalizer || echo MISSING) -> $(terminalizer --version 2>/dev/null || echo unknown)"
          echo "omp: $(command -v omp || echo MISSING)"; omp --version || true
          for f in scenarios/terminalizer/0*.sh; do
            s="$(basename "$f" .sh)"          # e.g. 01-launch-exit
            scenario="${s#*-}"                # e.g. launch-exit
            base="${{ matrix.cell_os }}-${{ matrix.shell }}-${scenario}"
            rec="rec/${base}.yml"
            gif="out/${base}.gif"
            echo "::group::record ${scenario}"
            # `terminalizer record` requires a real TTY on stdin (it calls
            # stdin.setRawMode); `script` allocates a pty so it works headlessly. The
            # -d command runs the scenario script to completion inside terminalizer's
            # node-pty, and that exit ends the recording. -k skips the sharing prompt.
            timeout 200 script -qec "terminalizer record 'rec/${base}' -c '${CFG}' -d '${{ matrix.shell }} ${f}' -k" /dev/null \
              || echo "  record exit=$? for ${scenario}"
            echo "  rec: $(ls -la "$rec" 2>/dev/null || echo MISSING)"
            if [ -s "$rec" ]; then
              echo "-- rendering ${scenario} (xvfb + headless Electron) --"
              timeout 300 xvfb-run -a --server-args='-screen 0 1920x1200x24' \
                terminalizer render "$rec" -o "$gif" -q 50 \
                || echo "  render exit=$? for ${scenario}"
            else
              echo "  no recording produced for ${scenario}; skipping render"
            fi
            echo "  gif: $(ls -la "$gif" 2>/dev/null || echo MISSING)"
            echo "::endgroup::"
          done
          echo "=== out ==="; ls -la out || true


      - name: Record and render scenarios (macOS)
        if: runner.os == 'macOS'
        shell: bash
        timeout-minutes: 20
        env:
          TERM: xterm-256color
        run: |
          set -u
          mkdir -p out rec
          CFG="scenarios/terminalizer/config.yml"
          echo "terminalizer: $(command -v terminalizer || echo MISSING) -> $(terminalizer --version 2>/dev/null || echo unknown)"
          echo "omp: $(command -v omp || echo MISSING)"; omp --version || true
          for f in scenarios/terminalizer/0*.sh; do
            s="$(basename "$f" .sh)"
            scenario="${s#*-}"
            base="${{ matrix.cell_os }}-${{ matrix.shell }}-${scenario}"
            rec="rec/${base}.yml"
            gif="out/${base}.gif"
            echo "::group::record ${scenario}"
            # BSD `script` allocates the TTY required by terminalizer's raw-mode input.
            if command -v gtimeout >/dev/null 2>&1; then
              gtimeout 200 script -q /dev/null terminalizer record "rec/${base}" \
                -c "$CFG" -d "${{ matrix.shell }} ${f}" -k \
                || echo "  record exit=$? for ${scenario}"
            else
              script -q /dev/null terminalizer record "rec/${base}" \
                -c "$CFG" -d "${{ matrix.shell }} ${f}" -k \
                || echo "  record exit=$? for ${scenario}"
            fi
            echo "  rec: $(ls -la "$rec" 2>/dev/null || echo MISSING)"
            if [ -s "$rec" ]; then
              echo "-- rendering ${scenario} (macOS window server) --"
              if command -v gtimeout >/dev/null 2>&1; then
                gtimeout 300 terminalizer render "$rec" -o "$gif" -q 50 \
                  || echo "  render exit=$? for ${scenario}"
              else
                terminalizer render "$rec" -o "$gif" -q 50 \
                  || echo "  render exit=$? for ${scenario}"
              fi
            else
              echo "  no recording produced for ${scenario}; skipping render"
            fi
            echo "  gif: $(ls -la "$gif" 2>/dev/null || echo MISSING)"
            echo "::endgroup::"
          done
          echo "=== out ==="; ls -la out || true

      - name: Record and render scenarios (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        timeout-minutes: 20
        env:
          TERM: xterm-256color
        run: |
          New-Item -ItemType Directory -Force -Path out, rec | Out-Null
          # Resolve the config to an ABSOLUTE path so terminalizer never depends on the
          # step's CWD, and so the value survives shim/quoting round-trips intact.
          $cfg = (Resolve-Path "scenarios/terminalizer/config.yml").Path
          Write-Host "terminalizer: $((Get-Command terminalizer).Source)"
          terminalizer --version
          Write-Host "omp: $((Get-Command omp).Source)"
          omp --version
          # One-time diagnostic: prove the config is found and dump resolved paths before
          # the loop. The previous failure was an empty "File not found:" — the pwsh .ps1
          # npm shim dropped the `-c`/`-d` argument VALUES, so terminalizer saw no config.
          Write-Host "::group::terminalizer diagnostics"
          Write-Host "cwd: $((Get-Location).Path)"
          Write-Host "config Test-Path: $(Test-Path 'scenarios/terminalizer/config.yml')"
          Write-Host "config abs: $cfg"
          # Route through cmd.exe (the .cmd npm shim forwards %* verbatim) instead of the
          # arg-mangling .ps1 shim, so `record --help` actually prints.
          cmd /c terminalizer record --help
          Write-Host "::endgroup::"
          Get-ChildItem "scenarios/terminalizer/0*.sh" | ForEach-Object {
            $scenario = $_.BaseName -replace '^[^-]+-', ''
            $base = "${{ matrix.cell_os }}-${{ matrix.shell }}-$scenario"
            # Absolute record base (terminalizer appends .yml) and gif output, so neither
            # depends on CWD once cmd.exe re-parses the command line.
            $recBase = Join-Path (Get-Location).Path "rec/$base"
            $rec = "$recBase.yml"
            $gif = Join-Path (Get-Location).Path "out/$base.gif"
            Write-Host "::group::record $scenario"
            # Invoke terminalizer through cmd.exe rather than the pwsh .ps1 shim, which
            # silently dropped `-c`/`-d` values and made every record die with an empty
            # "File not found:". cmd's .cmd shim forwards its arguments verbatim, so the
            # absolute, space-safe paths reach terminalizer unmangled. Any failure past
            # this point is a genuine tool/TTY limit, not an arg/shim/path bug.
            cmd /c terminalizer record "$recBase" -c "$cfg" -d "${{ matrix.shell }} $($_.FullName)" -k
            if ($LASTEXITCODE -ne 0) {
              Write-Host "  record exit=$LASTEXITCODE for $scenario"
            }
            if (Test-Path $rec -PathType Leaf) {
              Write-Host "-- rendering $scenario (Windows Electron) --"
              cmd /c terminalizer render "$rec" -o "$gif" -q 50
              if ($LASTEXITCODE -ne 0) {
                Write-Host "  render exit=$LASTEXITCODE for $scenario"
              }
            } else {
              Write-Host "  no recording produced for $scenario; skipping render"
            }
            Write-Host "  gif: $(if (Test-Path $gif) { Get-Item $gif } else { 'MISSING' })"
            Write-Host "::endgroup::"
          }
          Write-Host "=== out ==="
          Get-ChildItem out
      - name: Evaluate and emit results
        if: always()
        shell: bash
        run: |
          set -u
          # Stale-result poisoning bit VHS: start from a clean slate so this cell's
          # artifact carries ONLY its own fresh files (the checkout brings committed
          # results/assets that must not ride along).
          rm -rf results/terminalizer assets/terminalizer
          mkdir -p results/terminalizer assets/terminalizer
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          OMPV="$(omp --version 2>/dev/null | head -1 || echo unknown)"
          TOOLV="latest (npm $(terminalizer --version 2>/dev/null | head -1 || echo unknown))"
          for scenario in launch-exit help-tour tui-splash typing-demo; do
            base="${{ matrix.cell_os }}-${{ matrix.shell }}-${scenario}"
            gif="out/${base}.gif"
            if [ -f "$gif" ] && python scripts/validate_gif.py "$gif" >/dev/null 2>&1; then
              cp -f "$gif" "assets/terminalizer/${base}.gif"
              verdict=working; gifpath="assets/terminalizer/${base}.gif"
              case "$scenario" in
                typing-demo) reason="shell-prompt typing fallback: terminalizer records a command to completion and cannot inject keystrokes into the omp TUI input box headlessly (scenarios.md S4)";;
                *) reason="";;
              esac
            else
              verdict=broken; gifpath=""
              case "$scenario" in
                tui-splash) reason="terminalizer record runs a command to completion and cannot send an interactive quit to the omp TUI headlessly; a SIGINT->SIGTERM->SIGKILL watchdog ends the session but no valid GIF was captured";;
                typing-demo) reason="shell-prompt typing fallback produced no valid GIF in CI";;
                *) reason="no valid GIF produced in CI";;
              esac
            fi
            jq -n \
              --arg os "${{ matrix.cell_os }}" \
              --arg shell "${{ matrix.shell }}" \
              --arg scenario "$scenario" \
              --arg verdict "$verdict" \
              --arg reason "$reason" \
              --arg gif "$gifpath" \
              --arg run "$RUN_URL" \
              --arg ompv "$OMPV" \
              --arg toolv "$TOOLV" \
              '{tool:"terminalizer",os:$os,shell:$shell,scenario:$scenario,verdict:$verdict,reason:$reason,gif:(if $gif=="" then null else $gif end),run_url:$run,extra:{tool_version:$toolv,omp_version:$ompv}}' \
              > "results/terminalizer/${base}.json"
          done
          echo "=== results ==="; cat results/terminalizer/*.json

      - name: Upload cell artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: terminalizer-${{ matrix.cell_os }}-${{ matrix.shell }}
          path: |
            assets/terminalizer/
            results/terminalizer/
          if-no-files-found: warn

  collect:
    name: collect
    needs: [record]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: testing-vhs
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: _artifacts

      - name: Assemble assets and results
        run: |
          mkdir -p assets/terminalizer results/terminalizer
          find _artifacts -type f -name '*.gif' -exec cp -f {} assets/terminalizer/ \; || true
          find _artifacts -type f -name '*.json' -path '*results*' -exec cp -f {} results/terminalizer/ \; || true
          echo "=== assets/terminalizer ==="; ls -la assets/terminalizer || true
          echo "=== results/terminalizer ==="; ls -la results/terminalizer || true

      - name: Commit recordings and results
        run: |
          bash scripts/commit-artifacts.sh "chore(terminalizer): recordings + results"

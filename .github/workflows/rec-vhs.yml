name: rec-vhs

on:
  push:
    branches: [testing-vhs]
    paths:
      - '.github/workflows/rec-vhs.yml'
      - 'scenarios/vhs/**'
      - 'scenarios/shared/**'
      - 'scripts/**'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: rec-vhs-collect
  cancel-in-progress: false

jobs:
  record:
    name: ${{ matrix.cell_os }}-${{ matrix.shell }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04,   cell_os: linux,   shell: bash }
          - { os: ubuntu-22.04,   cell_os: linux,   shell: zsh }
          - { os: ubuntu-22.04,   cell_os: linux,   shell: pwsh }
          - { os: macos-latest,   cell_os: macos,   shell: zsh }
          - { os: windows-latest, cell_os: windows, shell: pwsh }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install omp (unix)
        if: runner.os != 'Windows'
        run: bash scenarios/shared/install-omp.sh

      - name: Install omp (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scenarios/shared/install-omp.ps1

      - name: Install zsh (linux zsh cell)
        if: matrix.cell_os == 'linux' && matrix.shell == 'zsh'
        run: sudo apt-get update && sudo apt-get install -y zsh

      - name: Compose tapes
        shell: bash
        run: |
          mkdir -p tapes out
          # VHS parses Output as a relative path (absolute paths break its parser) and
          # resolves it against the tape's own directory, so GIFs land in tapes/out/;
          # the Evaluate step locates them with `find`.
          for f in scenarios/vhs/0*.tape; do
            s="$(basename "$f" .tape)"        # e.g. 01-launch-exit
            scenario="${s#*-}"                # e.g. launch-exit
            base="${{ matrix.cell_os }}-${{ matrix.shell }}-${scenario}"
            {
              echo "Output out/${base}.gif"
              echo "Output out/${base}.mp4"
              echo "Output out/${base}.webm"
              echo "Set Shell \"${{ matrix.shell }}\""
              cat "$f"
            } > "tapes/${s}.tape"
          done
          echo "=== composed launch-exit tape ==="; cat tapes/01-launch-exit.tape

      # vhs-action installs vhs + ttyd + ffmpeg and adds them to PATH for later steps.
      # The tape it runs here is a throwaway warmup (it renders in its own temp dir).
      - name: Install VHS toolchain
        if: runner.os != 'Windows'
        uses: charmbracelet/vhs-action@v2
        continue-on-error: true
        timeout-minutes: 8
        with:
          path: tapes/01-launch-exit.tape
          version: v0.11.0
          install-fonts: true

      - name: Render scenarios in workspace
        if: runner.os != 'Windows'
        shell: bash
        timeout-minutes: 20
        run: |
          # setup-python exports LD_LIBRARY_PATH to its own lib dir, which breaks the
          # shared libs vhs's headless capture + ffmpeg load; clear it for the render.
          unset LD_LIBRARY_PATH
          echo "vhs: $(command -v vhs || echo MISSING)"; vhs --version 2>/dev/null || true
          echo "ttyd: $(command -v ttyd || echo MISSING)"
          echo "ffmpeg: $(command -v ffmpeg || echo MISSING)"
          for f in tapes/*.tape; do
            echo "== rendering $f =="
            vhs "$f"; echo "  exit=$? for $f"
          done
          echo "=== find gifs (path size) ==="; find . -type f -name '*.gif' -printf '%p %s\n' 2>/dev/null || find . -type f -name '*.gif'
          echo "=== out ==="; ls -la out || true; echo "=== tapes/out ==="; ls -la tapes/out || true

      - name: Evaluate and emit results
        if: always()
        shell: bash
        run: |
          set -u
          # Start from a clean slate so this cell's artifact carries ONLY its own fresh
          # files; the checkout brings stale committed results that must not ride along.
          rm -rf results/vhs assets/vhs
          mkdir -p results/vhs assets/vhs/gif assets/vhs/mp4 assets/vhs/webm
          # The step runs under -e -o pipefail, so a `find <dir>` whose <dir> is
          # missing exits 1 and aborts. Guarantee both search roots exist (empty on
          # Windows / a failed render) so find always exits 0 and yields no match.
          mkdir -p tapes/out out
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          OMPV="$(omp --version 2>/dev/null | head -1 || echo unknown)"
          for scenario in launch-exit help-tour tui-splash typing-demo; do
            base="${{ matrix.cell_os }}-${{ matrix.shell }}-${scenario}"
            # Scope to vhs's own render output (tapes/out, where VHS resolves the
            # Output path). Searching '.' also matched committed assets/console2svg
            # gifs of the same base name, so vhs silently served console2svg's files.
            gif="$(find tapes/out out -type f -name "${base}.gif" 2>/dev/null | head -1)"
            if [ "${{ runner.os }}" = "Windows" ]; then
              verdict=not-applicable; reason="VHS records via ttyd, which has no Windows build (Unix-only); the capture pipeline cannot run on Windows."; gifpath=""
            elif [ -n "$gif" ] && python scripts/validate_gif.py "$gif" >/dev/null 2>&1; then
              cp -f "$gif" "assets/vhs/gif/${base}.gif"
              for fmt in mp4 webm; do
                f="$(find tapes/out out -type f -name "${base}.${fmt}" 2>/dev/null | head -1)"
                [ -n "$f" ] && cp -f "$f" "assets/vhs/${fmt}/${base}.${fmt}"
              done
              verdict=working; reason=""; gifpath="assets/vhs/gif/${base}.gif"
            else
              verdict=broken; reason="no valid GIF produced in CI"; gifpath=""
            fi
            jq -n \
              --arg os "${{ matrix.cell_os }}" \
              --arg shell "${{ matrix.shell }}" \
              --arg scenario "$scenario" \
              --arg verdict "$verdict" \
              --arg reason "$reason" \
              --arg gif "$gifpath" \
              --arg run "$RUN_URL" \
              --arg ompv "$OMPV" \
              '{tool:"vhs",os:$os,shell:$shell,scenario:$scenario,verdict:$verdict,reason:$reason,gif:(if $gif=="" then null else $gif end),run_url:$run,extra:{tool_version:"v0.11.0",omp_version:$ompv}}' \
              > "results/vhs/${base}.json"
          done
          echo "=== results ==="; cat results/vhs/*.json

      - name: Upload cell artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vhs-${{ matrix.cell_os }}-${{ matrix.shell }}
          path: |
            assets/vhs/
            results/vhs/
          if-no-files-found: warn

  collect:
    name: collect
    needs: [record]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: testing-vhs
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: _artifacts

      - name: Assemble assets and results
        run: |
          mkdir -p results/vhs
          # Rebuild this tool's asset tree ONLY when the run actually produced files;
          # never wipe last-good committed assets on a zero-artifact (all-cells-failed) run.
          if find _artifacts -path '*/assets/vhs/*' -type f | grep -q .; then
            # Remove only the format subdirs so the report-owned README.md survives
            # (deleting it here races the report commit into a rebase delete/modify conflict).
            find assets/vhs -mindepth 1 -maxdepth 1 -type d -exec rm -rf {} + 2>/dev/null || true
            mkdir -p assets/vhs
          else
            echo "collect: no assets in _artifacts for vhs; keeping last-good committed files"
          fi
          find _artifacts -path '*/assets/vhs/*' -type f | while read -r f; do
            rel="${f#*/assets/vhs/}"
            mkdir -p "assets/vhs/$(dirname "$rel")"
            cp -f "$f" "assets/vhs/$rel"
          done
          find _artifacts -type f -name '*.json' -path '*results*' -exec cp -f {} results/vhs/ \; || true
          echo "=== assets/vhs ==="; ls -la assets/vhs || true
          echo "=== results/vhs ==="; ls -la results/vhs || true

      - name: Commit recordings and results
        run: |
          bash scripts/commit-artifacts.sh "chore(vhs): recordings + results"

<svg xmlns="http://www.w3.org/2000/svg" width="858" height="495" viewBox="0 0 858 495" role="img" aria-label="console2svg output">
<style>
.c2.c { font-family: "JetBrains Mono","Cascadia Mono","Segoe UI Mono","Noto Sans Mono","SFMono-Regular",Menlo,Consolas,"DejaVu Sans Mono","Liberation Mono",monospace; font-size: 14px; }
.c2 text { dominant-baseline: alphabetic; }
.c2 .q { shape-rendering: crispEdges; }
.c2 .c2b { animation: c2b 1s step-start infinite; }

.c2 .w { white-space: pre; }
.c2 .aa{fill:#d4d4d4}
.c2 .ab{fill:#FEFEFE;font-weight:bold}
@keyframes c2b { 50% { visibility: hidden; } }
</style><defs><pattern id="c2-redacted-stripe" patternUnits="userSpaceOnUse" width="8" height="8"><path d="M0 0h8v8H0z" fill="#1e1e1e"/><path d="M-2,2 L2,-2 M0,8 L8,0 M6,10 L10,6" stroke="#d4d4d4" stroke-width="2" opacity="0.3"/></pattern></defs><defs>
<linearGradient id="c2bg" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#1a1d2e"/><stop offset="100%" stop-color="#252840"/></linearGradient>
</defs>
<rect width="858" height="495" fill="url(#c2bg)"/>
<rect x="0.5" y="0.5" rx="10" ry="10" width="857" height="494" fill="#1f1f1f" stroke="#3a3a3a"/>
<rect x="1" y="1" rx="9" ry="9" width="856" height="27" fill="#2c2c2c"/>
<circle cx="14" cy="14" r="5" fill="#ff5f57"/>
<circle cx="30" cy="14" r="5" fill="#febc2e"/>
<circle cx="46" cy="14" r="5" fill="#28c840"/>

<rect x="1" y="28" width="856" height="466" rx="9" ry="9" fill="#1e1e1e"/>
<g class="c2 c"><rect x="9" y="36" width="840" height="18" fill="#1e1e1e"/>
<text class="aa" x="9" y="50">$ omp --help</text></g>
<defs>
<g id="c2r0" class="c2 c">
<rect width="840" height="18" id="c2e0" fill="#1e1e1e"/>
<text class="ab w" y="14" textLength="394.8">Available Tools (default-enabled unless noted):</text>
</g>
<g id="c2r1" class="c2 c">
<use href="#c2e0"/>
<text class="aa w" x="16.8" y="14" textLength="285.6">read          - Read file contents</text>
</g>
<g id="c2r2" class="c2 c">
<use href="#c2e0"/>
<text class="aa w" x="16.8" y="14" textLength="310.8">bash          - Execute bash commands</text>
</g>
<g id="c2r3" class="c2 c">
<use href="#c2e0"/>
<text class="aa w" x="16.8" y="14" textLength="369.6">edit          - Edit files with find/replace</text>
</g>
<g id="c2r4" class="c2 c">
<use href="#c2e0"/>
<text class="aa w" x="16.8" y="14" textLength="403.2">write         - Write files (creates/overwrites)</text>
</g>
<g id="c2r5" class="c2 c">
<use href="#c2e0"/>
<text class="aa w" x="16.8" y="14" textLength="302.4">grep          - Search file contents</text>
</g>
<g id="c2r6" class="c2 c">
<use href="#c2e0"/>
<text class="aa w" x="16.8" y="14" textLength="352.8">glob          - Find files by glob pattern</text>
</g>
<g id="c2r7" class="c2 c">
<use href="#c2e0"/>
<text class="aa w" x="16.8" y="14" textLength="504">lsp           - Language server protocol (code intelligence)</text>
</g>
<g id="c2r8" class="c2 c">
<use href="#c2e0"/>
<text class="aa w" x="16.8" y="14" textLength="537.6">python        - Execute Python code (requires: omp setup python)</text>
</g>
<g id="c2r9" class="c2 c">
<use href="#c2e0"/>
<text class="aa w" x="16.8" y="14" textLength="319.2">notebook      - Edit Jupyter notebooks</text>
</g>
<g id="c2r10" class="c2 c">
<use href="#c2e0"/>
<text class="aa w" x="16.8" y="14" textLength="386.4">browser       - Browser automation (Puppeteer)</text>
</g>
<g id="c2r11" class="c2 c">
<use href="#c2e0"/>
<text class="aa w" x="16.8" y="14" textLength="630">computer      - Native host desktop capture and input (disabled by default)</text>
</g>
<g id="c2r12" class="c2 c">
<use href="#c2e0"/>
<text class="aa w" x="16.8" y="14" textLength="436.8">task          - Launch sub-agents for parallel tasks</text>
</g>
<g id="c2r13" class="c2 c">
<use href="#c2e0"/>
<text class="aa w" x="16.8" y="14" textLength="319.2">todo          - Manage todo/task lists</text>
</g>
<g id="c2r14" class="c2 c">
<use href="#c2e0"/>
<text class="aa w" x="16.8" y="14" textLength="252">web_search    - Search the web</text>
</g>
<g id="c2r15" class="c2 c">
<use href="#c2e0"/>
<text class="aa w" x="16.8" y="14" textLength="487.2">ask           - Ask user questions (interactive mode only)</text>
</g>
<g id="c2r16" class="c2 c">
<use href="#c2e0"/>
</g>
<g id="c2r17" class="c2 c">
<use href="#c2e0"/>
<text class="ab w" y="14" textLength="126">Plugin Options:</text>
</g>
<g id="c2r18" class="c2 c">
<use href="#c2e0"/>
<text class="aa w" x="16.8" y="14" textLength="554.4">--plugin-dir &lt;path&gt;        Load plugin from directory (repeatable)</text>
</g>
<g id="c2r19" class="c2 c">
<use href="#c2e0"/>
<text class="ab w" y="14" textLength="134.4">Useful Commands:</text>
</g>
<g id="c2r20" class="c2 c">
<use href="#c2e0"/>
<text class="aa w" x="16.8" y="14" textLength="730.8">omp agents unpack           - Export bundled subagents to ~/.omp/agent/agents (default)</text>
</g>
<g id="c2r21" class="c2 c">
<use href="#c2e0"/>
<text class="aa w" x="16.8" y="14" textLength="596.4">omp agents unpack --project - Export bundled subagents to ./.omp/agents</text>
</g>
</defs>
